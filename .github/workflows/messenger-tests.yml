name: Messenger checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q bot.py messenger_core.py messenger_http.py messenger_telegram.py messenger_avatar.py messenger_startup.py
      - run: python -m unittest discover -s tests -v
